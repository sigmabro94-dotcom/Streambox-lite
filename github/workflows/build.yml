
name: StreamBox Lite APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Backup ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          find extracted -name gradlew -type f

      - name: Locate Android project
        run: |
          PROJECT=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "gradlew not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV
          chmod +x "$PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamBoxLite-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
