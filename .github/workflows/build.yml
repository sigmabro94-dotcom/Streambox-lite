
name: StreamBox Lite APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          unzip -q "$ZIP" -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Git and Build APK
        run: |
          PROJECT=$(find extracted -name gradlew -type f | head -n 1)
          test -n "$PROJECT" || { echo "Gradle project missing"; exit 1; }
          cd "$(dirname "$PROJECT")"
          chmod +x gradlew
          git init -b main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Prepare StreamBox Lite build"
          ./gradlew assembleDebug

      - name: Collect APK
        run: |
          APK=$(find extracted -type f -name "*.apk" -path "*/build/outputs/apk/*" | head -n 1)
          test -n "$APK" || { echo "APK not generated"; exit 1; }
          mkdir -p artifacts
          cp "$APK" artifacts/StreamBoxLite.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamBoxLite-APK
          path: artifacts/StreamBoxLite.apk
          if-no-files-found: error
          
