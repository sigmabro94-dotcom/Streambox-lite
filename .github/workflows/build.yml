
name: StreamBox Lite APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          unzip -q "$ZIP" -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Build both APK variants
        run: |
          PROJECT=$(find extracted -name gradlew -type f | head -n 1)
          test -n "$PROJECT" || { echo "Gradle project missing"; exit 1; }
          cd "$(dirname "$PROJECT")"
          chmod +x gradlew
          git init -b main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Prepare StreamBox Lite build"
          ./gradlew assembleStableDebug assemblePrereleaseDebug

      - name: Collect APKs
        run: |
          set -e
          mkdir -p artifacts
          STABLE=$(find extracted -type f -iname "*.apk" -path "*/stable/debug/*" | head -n 1)
          PRE=$(find extracted -type f -iname "*.apk" -path "*/prerelease/debug/*" | head -n 1)
          test -n "$STABLE" || { echo "Stable APK missing"; exit 1; }
          test -n "$PRE" || { echo "Prerelease APK missing"; exit 1; }
          cp "$STABLE" artifacts/StreamBoxLite-Stable.apk
          cp "$PRE" artifacts/StreamBoxLite-Prerelease.apk

      - name: Check APK integrity and Android requirements
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for APK in artifacts/*.apk; do
            echo "===== $APK ====="
            unzip -tq "$APK"
            "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:" || true
            sha256sum "$APK"
          done

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamBoxLite-Verified-APKs
          path: artifacts/*.apk
          if-no-files-found: error
